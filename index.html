<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>JavaScript - Objetos</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>🚗 Cadastro de Carros</h1>

        <fieldset>

            <legend>Dados do Carro</legend>

            <form>

                <label for="marca">Marca:</label>
                <input type="text" id="marca" placeholder="Ex: Fiat">

                <label for="modelo">Modelo:</label>
                <input type="text" id="modelo" placeholder="Ex: Uno">

                <label for="ano">Ano de fabricação:</label>
                <input type="number" id="ano" min="1900" max="2026">

                <label for="cor">Cor:</label>
                <input type="color" id="cor">

                <button type="button" onclick="AddCarrosArray()">
                    Adicionar Carro
                </button>

            </form>

        </fieldset>

        <section>

            <h2>Carros cadastrados</h2>

            <div id="listaCarros"></div>

        </section>

    </div>

    <script src="js/script.js"></script>

</body>

</html>
